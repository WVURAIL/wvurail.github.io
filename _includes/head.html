<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />

   <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
   <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}" />

   <!-- Open Graph (nicer link previews when shared) -->
   <meta property="og:title" content="{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}" />
   <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}" />
   <meta property="og:type" content="website" />
   <meta property="og:url" content="{{ page.url | absolute_url }}" />
   <meta property="og:image" content="{{ '/images/banner.jpg' | absolute_url }}" />

   <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" />
   <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}" />

   <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
   <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}" />
</head>
