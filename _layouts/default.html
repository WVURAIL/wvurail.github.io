<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
   {% include header.html %}

   <main id="main">
      {%- if page.full_width %}
      {{ content }}
      {%- else %}
      <div class="page-head">
         <div class="container">
            <p class="eyebrow">{{ page.eyebrow | default: "WVU RAIL" }}</p>
            <h1>{{ page.title }}</h1>
            {%- if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
         </div>
      </div>
      <div class="section">
         <div class="container">
            <div class="prose">
               {{ content }}
            </div>
         </div>
      </div>
      {%- endif %}
   </main>

   {% include footer.html %}
   {% include scripts.html %}
</body>
</html>
