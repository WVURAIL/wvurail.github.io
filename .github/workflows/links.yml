name: Links
'on':
  schedule:
  - cron: 41 6 * * 0
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  links:
    name: Check every link on the built site
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
    - name: Build
      run: bundle exec jekyll build --trace
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        JEKYLL_ENV: production
    - name: Check links, with one retry
      run: "# One transient 502 from somebody else's server is not worth an email.\n# Two, five minutes apart, probably is.\n\
        if python3 .github/scripts/check_links.py; then\n  exit 0\nfi\necho \"::notice::first pass found broken links \u2014\
        \ waiting 5 minutes and trying again\"\nsleep 300\npython3 .github/scripts/check_links.py\n"
