name: Build
'on':
  push:
    branches-ignore:
    - main
  pull_request: null
  workflow_dispatch: null
  workflow_call:
    inputs:
      pages_artifact:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  jekyll:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
    - name: Check shared site tools
      run: |
        python3 -m pip install -r .github/site-tools/requirements-checks.txt
        python3 -m unittest discover -s .github/site-tools/tests -v
        npm ci --prefix .github/site-tools
        npm test --prefix .github/site-tools
    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
    - name: Build
      run: bundle exec jekyll build --trace
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        JEKYLL_ENV: production
    - name: Trim unused Design System styles
      run: |
        node .github/site-tools/scripts/trim_styles.mjs _site assets/wvu-design-system/site.min.css
    - name: Every expected page exists and is non-empty
      run: |
        set -euo pipefail
        for page in \
          index.html \
          people/index.html \
          publications/index.html \
          bandura/index.html \
          bandura/cv/index.html \
          accessibility/index.html \
          where-we-work/index.html \
          who-we-work-with/index.html \
          dspiratalk/index.html \
          contact/index.html \
          projects/index.html \
          tools/index.html \
          tools/lst/index.html \
          tools/coord/index.html \
          education/index.html \
          ret-dspira/index.html \
          apps/index.html \
          education/dspira-2017/index.html \
          education/dspira-2018/index.html \
          education/dspira-2019/index.html \
          dspira-2017/index.html \
          dspira-2018/index.html \
          dspira-2019/index.html
        do
          if [ ! -s "_site/$page" ]; then
            echo "::error::_site/$page is missing or empty"
            exit 1
          fi
        done
        echo "All expected pages built."
    - name: The data-driven lists actually rendered
      run: "set -euo pipefail\nfail=0\ncheck() {  # name, file, pattern, minimum\n  # `|| true` matters: grep exits 1 on zero\
        \ matches, and with\n  # `set -euo pipefail` that killed the step before it could print the\n  # diagnostic this check\
        \ exists to produce.\n  n=$(grep -o \"$3\" \"_site/$2\" | wc -l || true)\n  echo \"$1: $n\"\n  if [ \"$n\" -lt \"\
        $4\" ]; then\n    echo \"::error::$1 rendered $n (expected >= $4) \u2014 data or a Liquid filter is broken\"\n   \
        \ fail=1\n  fi\n}\n# Each pattern is the element a template emits exactly once per data\n# entry. The Design System\
        \ markup is mostly Bootstrap utility classes,\n# so several of these are the utility string of that one element on\n\
        # that one page \u2014 if the page gains another element with the same\n# string the count inflates, but it can never\
        \ be satisfied by an\n# empty loop, which is what the check exists to catch.\ncheck \"publication entries\" publications/index.html\
        \ '<li class=\"pub' 60\n# `person` is the one semantic hook on /people/: the PI row, each\n# researcher card and the\
        \ open-position card all carry it.\ncheck \"people cards\"        people/index.html       'class=\"person '  2\ncheck\
        \ \"alumni rows\"         people/index.html       '<li class=\"border-bottom py-4\">' 5\ncheck \"site cards\"    \
        \      where-we-work/index.html 'class=\"card h-100 border-0 bg-wvu-not-quite-white\"' 4\n# The cohort-roster include\
        \ looks its roster up in _data/education.yml\n# by year. If that lookup ever misses, the page still builds \u2014\
        \ it just\n# renders with no names and a blank stats row. Assert the names are\n# there: one <li> per teacher, one\
        \ \"returning\" badge per returner.\ncheck \"2017 roster\"         education/dspira-2017/index.html  '<li class=\"\
        col-24 col-sm-12 col-lg-8\">' 9\ncheck \"2018 roster\"         education/dspira-2018/index.html  '<li class=\"col-24\
        \ col-sm-12 col-lg-8\">' 6\ncheck \"2019 roster\"         education/dspira-2019/index.html  '<li class=\"col-24 col-sm-12\
        \ col-lg-8\">' 6\ncheck \"2019 returning tags\" education/dspira-2019/index.html  'class=\"badge bg-wvu-blue text-white\
        \ ms-2\">returning' 4\nexit $fail\n"
    - name: No unrendered Liquid escaped into the output
      run: |
        set -euo pipefail
        if grep -rn '{%\|{{' _site --include='*.html'; then
          echo "::error::Found unrendered Liquid tags in the built site"
          exit 1
        fi
        echo "No unrendered Liquid."
    - name: The lesson count placeholder was substituted
      run: "set -euo pipefail\n# The count is written once, as materials.lesson_count, and reaches the\n# page through a `replace`\
        \ filter on the %COUNT% placeholder. Drop that\n# filter and the build still succeeds \u2014 the page just reads\n\
        # \"%COUNT% lessons\" to every visitor. It is not Liquid, so the check\n# above does not see it.\nif grep -rn '%COUNT%'\
        \ _site --include='*.html'; then\n  echo \"::error::%COUNT% reached the built site \u2014 a `replace` filter is missing\"\
        \n  exit 1\nfi\nn=$(grep -c 'Lessons published' _site/education/index.html || true)\n[ \"$n\" -ge 1 ] || { echo \"\
        ::error::the lessons stat tile is gone from /education/\"; exit 1; }\necho \"No %COUNT% left in the output.\"\n"
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        repository: WVURAIL/dspira
        ref: main
        path: .dependencies/dspira
        lfs: true
        persist-credentials: false
    - name: Install locked lesson dependencies
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/.dependencies/dspira/Gemfile
    - name: Build current lesson redirects
      run: |
        bundle exec jekyll build --trace -d ../../_lessons
      working-directory: .dependencies/dspira
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/.dependencies/dspira/Gemfile
        JEKYLL_ENV: production
    - name: Preserve retired website addresses
      run: |
        if [ -f .dependencies/dspira/tools/notebook-requirements.txt ]; then
          python3 -m pip install --quiet -r .dependencies/dspira/tools/notebook-requirements.txt
        fi
        python3 .dependencies/dspira/tools/test_publish_pages.py
        python3 .dependencies/dspira/tools/test_retired_sites.py
        python3 .dependencies/dspira/tools/test_publish_assets.py
        python3 .dependencies/dspira/tools/publish_assets.py --site _lessons
        python3 .dependencies/dspira/tools/publish_pages.py --site _lessons --alias _site/dspira-lessons
        python3 .dependencies/dspira/tools/retired_sites.py fetch --destination _retired
        python3 .dependencies/dspira/tools/retired_sites.py aliases --source _retired --site _site
        test -s _site/cra/index.html
        test -s _site/dspira-archive/labs/01/index.html
        test -s _site/gr-transient/index.html
        test -s _site/dspira-lessons/dsplab-intro/index.html
        test $(du -sb _site | cut -f1) -lt 1000000000
    - name: Check production settings
      run: |
        test -s _site/index.html
        test -s _site/education/index.html
        test -s _site/publications/index.html
        grep -qx 'wvurail.org' _site/CNAME
        if grep -q 'name="robots" content="noindex"' _site/index.html; then exit 1; fi
        grep -q 'href="/dspira/' _site/index.html
    - name: Upload the built site
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: site
        path: _site
        retention-days: 7
    - name: Package the validated site
      if: ${{ inputs.pages_artifact }}
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        path: _site
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
