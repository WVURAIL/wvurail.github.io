# Builds the site the way GitHub Pages actually builds it, on every push and pull
# request.
#
# Why this exists: the Pages builder reports failures only by email, after the
# fact, and keeps serving the last good build. So a broken Liquid tag looks like
# "the site just didn't update" rather than an error. This makes that loud.
#
# Why it installs the `github-pages` gem instead of using the repo's Gemfile:
# Pages runs Jekyll 3.9 through that gem, while the Gemfile tracks Jekyll 4.3 for
# local development. Building against 4.3 here could go green on something 3.9
# rejects — which is exactly the failure this workflow is meant to prevent.
name: Build

on:
  push:            # every branch, so a broken push is caught before a PR exists
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jekyll:
    name: Jekyll build (github-pages gem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pin the exact gems GitHub Pages uses
        run: |
          cat > Gemfile.ci <<'GEMFILE'
          source "https://rubygems.org"
          # The metagem Pages itself runs — pins Jekyll 3.9 and the allowed plugins.
          gem "github-pages", group: :jekyll_plugins
          # Ruby 3.0+ dropped webrick from the stdlib; Jekyll 3.9 still wants it.
          gem "webrick", "~> 1.8"
          GEMFILE

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci

      - name: Build
        run: bundle exec jekyll build --trace
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.ci
          JEKYLL_ENV: production

      # A Jekyll build can succeed while a Liquid filter silently yields nothing,
      # so also assert on the rendered output.
      - name: Every expected page exists and is non-empty
        run: |
          set -euo pipefail
          for page in \
            index.html \
            people/index.html \
            publications/index.html \
            bandura/index.html \
            where-we-work/index.html \
            who-we-work-with/index.html \
            dspiratalk/index.html \
            contact/index.html \
            projects/index.html \
            tools/index.html \
            tools/lst/index.html \
            tools/coord/index.html \
            education/index.html \
            ret-dspira/index.html \
            apps/index.html \
            education/dspira-2017/index.html \
            education/dspira-2018/index.html \
            education/dspira-2019/index.html \
            dspira-2017/index.html \
            dspira-2018/index.html \
            dspira-2019/index.html
          do
            if [ ! -s "_site/$page" ]; then
              echo "::error::_site/$page is missing or empty"
              exit 1
            fi
          done
          echo "All expected pages built."

      - name: The data-driven lists actually rendered
        run: |
          set -euo pipefail
          fail=0
          check() {  # name, file, pattern, minimum
            # `|| true` matters: grep exits 1 on zero matches, and with
            # `set -euo pipefail` that killed the step before it could print the
            # diagnostic this check exists to produce.
            n=$(grep -o "$3" "_site/$2" | wc -l || true)
            echo "$1: $n"
            if [ "$n" -lt "$4" ]; then
              echo "::error::$1 rendered $n (expected >= $4) — data or a Liquid filter is broken"
              fail=1
            fi
          }
          check "publication entries" publications/index.html '<li class="pub' 60
          check "people cards"        people/index.html       'class="person'   3
          check "alumni rows"         people/index.html       'class="alumni-row"' 5
          check "site cards"          where-we-work/index.html 'class="site"'   4
          # The cohort layout looks its roster up in _data/education.yml by year.
          # If that lookup ever misses, the page still builds — it just renders
          # with no names and a blank stats row. Assert the names are there.
          check "2017 roster"         education/dspira-2017/index.html  'class="roster-name"' 9
          check "2018 roster"         education/dspira-2018/index.html  'class="roster-name"' 6
          check "2019 roster"         education/dspira-2019/index.html  'class="roster-name"' 6
          check "2019 returning tags" education/dspira-2019/index.html  'class="roster-return"' 4
          exit $fail

      - name: No unrendered Liquid escaped into the output
        run: |
          set -euo pipefail
          if grep -rn '{%\|{{' _site --include='*.html'; then
            echo "::error::Found unrendered Liquid tags in the built site"
            exit 1
          fi
          echo "No unrendered Liquid."

      - name: The lesson count placeholder was substituted
        run: |
          set -euo pipefail
          # The count is written once, as materials.lesson_count, and reaches the
          # page through a `replace` filter on the %COUNT% placeholder. Drop that
          # filter and the build still succeeds — the page just reads
          # "%COUNT% lessons" to every visitor. It is not Liquid, so the check
          # above does not see it.
          if grep -rn '%COUNT%' _site --include='*.html'; then
            echo "::error::%COUNT% reached the built site — a `replace` filter is missing"
            exit 1
          fi
          n=$(grep -c 'Lessons published' _site/education/index.html || true)
          [ "$n" -ge 1 ] || { echo "::error::the lessons stat tile is gone from /education/"; exit 1; }
          echo "No %COUNT% left in the output."

      - name: Upload the built site
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: _site
          retention-days: 7
