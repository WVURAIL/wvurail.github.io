<h2>Web Apps for Radio Astronomy</h2>
<hr>

<div id="js_clock" class="clock"></div>

<hr>
<ul class="actions vertical">
   <li><a href="{{ '/apps/lst/' | relative_url }}" class="button">Local Sidereal Time for your location</a></li>
   <li><a href="{{ '/apps/coord/' | relative_url }}" class="button">Horizontal &rarr; Equatorial coordinate converter</a></li>
</ul>

<script src="{{ '/apps/astro.js' | relative_url }}"></script>
<script>
(function () {
   var GREEN_BANK = -79.8318;   // degrees, east-positive
   var MORGANTOWN = -79.9559;

   function tick() {
      var now = new Date();
      var utc = pad2(now.getUTCHours()) + ":" + pad2(now.getUTCMinutes()) + ":" + pad2(now.getUTCSeconds());
      document.getElementById('js_clock').innerHTML =
         "Coordinated Universal Time (UTC): " + utc + "<br>" +
         "Greenwich Sidereal Time: " + hmsFromHours(lstNow(now, 0)) + "<br>" +
         "Green Bank, WV — Local Sidereal Time: " + hmsFromHours(lstNow(now, GREEN_BANK)) + "<br>" +
         "Morgantown, WV — Local Sidereal Time: " + hmsFromHours(lstNow(now, MORGANTOWN));
   }
   tick();
   setInterval(tick, 1000);
})();
</script>
