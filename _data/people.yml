# All lab members. Add/remove people here — the People section renders automatically.
# Fields: name (required), photo, roles[], bio, open (bool), email, phone,
#         office, link{text,url}, publication{label,title,url,year}.

pi:
  - name: "Kevin M. Bandura, Ph.D."
    photo: /images/people/kbandura.jpg
    roles:
      - "Associate Professor, Department of Computer Science and Electrical Engineering"
      - "Adjunct Assistant Professor, Department of Physics and Astronomy"
    email: "kevin.bandura@mail.wvu.edu"
    phone: "(304) 293-9686"
    office: "AERB 237"
    link:
      text: "Faculty page & CV"
      url: "/bandura/"
    bio: >
      Dr. Bandura builds the systems behind wide-field radio telescopes — the analog
      front ends, FPGA correlators, and timing chains that let an instrument like CHIME
      survey the whole overhead sky at once. The science driving that work is 21 cm
      intensity mapping, which traces neutral hydrogen to measure how the universe's
      expansion has accelerated, and the outrigger stations that localize fast radio
      bursts precisely enough to identify the galaxies they came from.

grad:
  - name: "Dylan J. Gormley"
    photo: /images/people/dgormley.jpg
    roles:
      - "Ph.D. Candidate"
    bio: "Research focus on radio frequency interference (RFI) mitigation."

students:
  - name: "This could be you"
    open: true          # renders as the open-position card, no portrait
    bio: >
      We take on undergraduate and graduate researchers every year. Write to
      Prof. Kevin Bandura to talk about joining.
    email: "kevin.bandura@mail.wvu.edu"

