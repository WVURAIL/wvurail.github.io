#         publication{label,title,url}.

pi:
  - name: "Kevin M. Bandura, Ph.D."
    photo: /images/people/kbandura.jpg
    roles:
      - "Associate Professor, Department of Computer Science and Electrical Engineering"
      - "Adjunct Assistant Professor, Department of Physics and Astronomy"
    link:
      text: "Faculty Webpage"
      url: "http://community.wvu.edu/~kmbandura/"
    bio: >
      Dr. Bandura's research interests lie in uncovering the mysteries of the universe,
      with a particular focus on gaining a deeper understanding of Dark Energy — the term
      used to describe the force behind the accelerated expansion of our cosmos. This pursuit
      has driven him to concentrate on constructing wide-field survey radio astronomy
      instruments, like CHIME, to enhance our comprehension of the universe.

grad:
  - name: "Dylan J. Gormley"
    photo: /images/people/dgormley.jpg
    roles:
      - "Ph.D. Candidate"
    bio: "Research focus on radio frequency interference (RFI) mitigation."

students:
  - name: "This could be you"
    open: true          # renders as the open-position card, no portrait
    bio: >
      We take on undergraduate and graduate researchers every year. Message
      Prof. Kevin Bandura to talk about joining.

