# Kevin Bandura's living CV. Drives /bandura/ (_pages/bandura.html).
#
# Why this file exists: the WVU faculty page (community.wvu.edu/~kmbandura)
# is being retired, so the lab site now carries the CV of record. The page
# pulls Kevin's WVU-era publications straight from _data/publications.yml
# (every entry whose `people` includes "K. Bandura"), so new lab papers appear
# on the CV automatically. This file holds everything else: the CV sections,
# plus the publications the lab list deliberately leaves out — pre-WVU work
# (CMU and McGill years, including the ICE papers), white papers, and the
# retracted 2022 Nature paper (listed under its own clearly-marked heading;
# the lab pages still exclude it — see the note in publications.yml).
#
# Publication-shaped entries below use the same fields as publications.yml,
# so _includes/publication.html renders them unchanged.
#
# `review:` keys are questions for a human — DELETE once confirmed, same
# convention as publications.yml. Links appear only where they were verified;
# a missing doi/arxiv just means nobody has looked it up yet.
#
# Sources: the retired faculty page and its 2016 CV PDF, INSPIRE-HEP, arXiv,
# Crossref, NSF award search, Statler College news, and Dylan (Aug 2026).

