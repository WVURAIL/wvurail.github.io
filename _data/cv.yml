# ---------------------------------------------------------------------------
# Listed on the CV under its own clearly-marked heading, per an editorial
# decision in Aug 2026 (Dylan): a complete CV that silently omitted it would
# read worse to anyone cross-checking Google Scholar than one that marks it.
# The lab publication pages still exclude it — see the note in
# publications.yml, which stays authoritative for the lab lists.
retracted:
  - year: 2022
    title: "Sub-second periodicity in a fast radio burst"
    authors: "CHIME/FRB Collaboration, incl. K. Bandura"
    venue: "Nature"
    ref: "Nature 607, 256"
    doi: 10.1038/s41586-022-04841-8
    people:
    - K. Bandura
    - P. Sanghavi
    - J. Kania
    note: "Retracted 23 June 2026 (retraction notice: doi 10.1038/s41586-026-10799-8). An unusual calibration problem left CHIME's digital beams incorrectly pointed when FRB 20191221A was detected; the reported periodicity was the known Galactic pulsar PSR J0248+6021."
