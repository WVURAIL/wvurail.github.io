# Kevin Bandura's account supplies the COVID context. The public award and
# repository records independently establish the timing and later activity.
phases:
  - label: 2017–2019
    title: Three in-person cohorts
    body: >
      Teachers spent six weeks at WVU and Green Bank building instruments,
      observing the Milky Way, and carrying projects back to their classrooms.
      These are the three cohorts documented in detail on this site.
  - label: 2020–2021
    title: The work moved online
    body: >
      The public lessons repository launched in July 2020. During the award's
      final two years, teachers and staff consolidated lectures, labs, setup
      guides, and technical discussion into an online home.
  - label: 2022–present
    title: DSPIRA's next hardware chapter
    body: >
      The in-person summers did not return to their earlier cadence, but the
      educator network, lessons, and telescope platform continued. The outreach
      component of NSF Award 2511256 now uses DSPIRA receivers as prototypes for
      a more robust lab for high-school teachers and students, while continuing
      education-oriented receiver development for STEM programs at WVU and Yale.

# What a summer actually involved.
arc:
  - title: Build the telescope
    body: >
      Each teacher assembled a horn antenna and a low-noise amplifier from sheet
      metal and off-the-shelf parts, then tested it in the RF lab at WVU.
  - title: Learn the tools
    body: >
      GNU Radio, Python and software-defined radio — the same open-source stack
      the lab uses to commission real instruments, not a teaching substitute.
  - title: Observe
    body: >
      Six weeks ended at Green Bank, mapping neutral hydrogen in the Milky Way
      with the horn they had built, alongside the observatory's own telescopes.
  - title: Take it back to class
    body: >
      Each cohort wrote lessons and classroom exercises from what they had done,
      and continued the projects with their own students during the school year.

