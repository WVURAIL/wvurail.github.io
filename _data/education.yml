# DSPIRA — the lab's science-education work.
#
# Framing, decided deliberately: DSPIRA was a three-year NSF Research Experiences
# for Teachers site that ran its cohorts in 2017, 2018 and 2019 and concluded.
# The curriculum it produced is still maintained and still used. So the program
# is described in the PAST tense and the materials in the PRESENT tense.
#
# Please keep those tenses straight when editing. Before this rewrite the same
# program was described in future tense on /education/, present tense on the
# home page, and past tense on the lessons site — because the program page was
# verbatim grant-proposal prose that nobody revisited after the award.

summary: >
  DSPIRA — Digital Signal Processing in Radio Astronomy — was an NSF Research
  Experiences for Teachers site run by the lab with the WVU Center for
  Gravitational Waves and Cosmology and the Green Bank Observatory. Over three
  summers, high school teachers built working horn radio telescopes, learned the
  same open-source signal-processing tools the lab uses on real instruments, and
  wrote classroom lessons around them.

# One-line answer to "is this still running?" — shown near the top of the page.
status: >
  The cohort program ran from 2017 to 2019 and has concluded. The curriculum it
  produced is still online, still maintained, and free for anyone to use.

principal_investigators:
  - Natalia Schmid
  - Kevin Bandura
observatory_coordinator: Richard Prestage
partners:
  - WVU Lane Department of Computer Science and Electrical Engineering
  - WVU Center for Gravitational Waves and Cosmology
  - Green Bank Observatory

facts:
  - label: Summers
    value: "3"
    note: 2017, 2018 and 2019
  - label: Teachers
    value: "15"
    note: Across 21 cohort places
  - label: Home states
    value: "8"
    note: CA, FL, MD, NC, NY, RI, TX, WV
  # 48 = the number of lessons on wvurail.org/dspira-lessons. That site counts
  # its own posts and prints the figure on its front page, so read it there
  # before changing this one. It has drifted twice: once when the cra and dspira
  # material was migrated across, and again when the correlation and
  # interferometry lesson was published. It is written down three times in this
  # file — this value, materials.lesson_count, and the sentence in
  # materials.intro — and all three have to move together.
  - label: Lessons published
    value: "48"
    note: Free, open, still online

# The part that is still alive. This is the section that should be hardest to
# miss on the page.
materials:
  title: The lessons are still here
  lesson_count: 48
  intro: >
    Everything the program produced is public: 48 lessons across eleven modules,
    covering the astronomy, the hardware, the signal processing, and the labs.
    Written for high school teachers, but used by students and hobbyists too.
  url: "https://wvurail.org/dspira-lessons/"
  # Mirrors _data/modules.yml on the lessons site, in the same order, so a
  # visitor who clicks through sees the same list.
  modules:
    - Horn construction
    - Telescope hardware setup
    - Telescope software setup
    - Horn operation
    - Telescope operation
    - Digital signal processing
    - Astronomy
    - Labs
    - GNU Radio
    - Raspberry Pi
    - WISRD Radio Astronomy Group
  extras:
    - text: Browse all lessons
      url: "https://wvurail.org/dspira-lessons/all/"
    - text: Request a telescope kit
      url: "https://wvurail.org/dspira-lessons/kits/"
    # The one part of the lessons site a visitor can talk back through. It runs
    # on GitHub Discussions, and threads there go back to 2020.
    - text: Ask a question in the forum
      url: "https://wvurail.org/dspira-lessons/forum/"
    - text: GNU Radio modules on GitHub
      url: "https://github.com/WVURAIL/gr-radio_astro"

# What a summer actually involved.
arc:
  - title: Build the telescope
    body: >
      Each teacher assembled a horn antenna and a low-noise amplifier from sheet
      metal and off-the-shelf parts, then tested it in the RF lab at WVU.
  - title: Learn the tools
    body: >
      GNU Radio, Python and software-defined radio — the same open-source stack
      the lab uses to commission real instruments, not a teaching substitute.
  - title: Observe
    body: >
      Six weeks ended at Green Bank, mapping neutral hydrogen in the Milky Way
      with the horn they had built, alongside the observatory's own telescopes.
  - title: Take it back to class
    body: >
      Each cohort wrote lessons and classroom exercises from what they had done,
      and continued the projects with their own students during the school year.

