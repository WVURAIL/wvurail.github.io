# DSPIRA — the lab's science-education work.
#
# Keep the related timelines distinct when editing this page:
#   * NSF award 1611114 ran from January 2017 through December 2021.
#   * This site's detailed in-person cohort archive covers 2017, 2018 and 2019.
#   * COVID interrupted the in-person program's momentum; the lessons, educator
#     network and telescope platform continued at a different cadence.
#   * The outreach component of NSF award 2511256 (2025–28) now builds directly
#     on DSPIRA receivers. It continues one strand of DSPIRA, but the award's
#     primary research focus is advanced calibration for 21 cm cosmology.
#
# The original abstract proposed three summer cohorts, while NSF's final outcome
# report describes teacher participation and program development across five
# summers. It is therefore accurate to call 2017–19 the three documented
# in-person cohorts, but not to say that DSPIRA itself ended in 2019.

summary: >
  DSPIRA — Digital Signal Processing in Radio Astronomy — began as an NSF
  Research Experiences for Teachers site run by the lab with the WVU Center for
  Gravitational Waves and Cosmology and the Green Bank Observatory. Three
  documented in-person cohorts built working horn radio telescopes in 2017–19.
  Beginning in 2020, participants concentrated on making the curriculum and
  collaboration available online.

# One-line answer to "is this still running?" — shown near the top of the page.
status: >
  The pandemic interrupted the momentum of DSPIRA's in-person summers, but the
  original RET award was seed funding—not an expiration date. The project
  continues through its educators, open curriculum, and telescope platform;
  the outreach component of NSF Award 2511256 is developing a more robust
  generation of DSPIRA-based outreach receivers through 2028.

