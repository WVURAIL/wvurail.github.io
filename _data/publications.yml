# Papers the lab has been part of.
#
# Compiled from INSPIRE-HEP, Crossref, NSF-PAR, arXiv, the CHIME collaboration's
# publication page, and author CVs. It is a starting point, not gospel — check
# anything carrying a `review:` note, then delete that key.
#
# Scope: work published by Kevin Bandura or by a lab graduate DURING their time at
# WVU. Pre-WVU work is excluded (including the McGill-era ICE papers). One
# retracted paper is deliberately excluded — see PUBLICATIONS-REVIEW.md.
#
# Fields
#   year      (required)  Used for grouping; the page sorts newest first.
#   title     (required)  No trailing period.
#   authors   (required)  Displayed verbatim. For collaboration papers, something
#                         like "CHIME/FRB Collaboration, incl. K. Bandura".
#   venue                 Journal or conference.
#   ref                   Volume/pages/article number, e.g. "ApJ 947, 83".
#   doi                   Bare DOI. Linked automatically.
#   arxiv                 Bare arXiv id. Linked automatically.
#   url                   Any other link, used when there is no DOI or arXiv.
#   people                Lab members on the paper; rendered as small tags.
#   preprint  true        Marks it as not yet refereed.
#   highlight true        Pins it to the "Selected" band at the top of the page.
#   note                  One short line of context shown in grey. Optional.
#   review                A question for a human. Shown to editors only in the
#                         sense that it is a reminder in this file — DELETE the
#                         key once the entry is confirmed.

