# Who we work with — renders at /who-we-work-with/.
#
# Compiled August 2026 from author affiliations across all 69 papers in
# _data/publications.yml: INSPIRE-HEP records for 64 papers, the papers' own
# front matter for the rest. Department-level entries are merged into their
# parent institution. Counts and completeness caveats live on the page itself.
# Prune or add freely — the page renders whatever is here.
#
# review: P. Sanghavi's affiliation on the 2026 RNAAS note could not be
# identified from records; add its institution below if it is new.

featured:
  - name: "Green Bank Observatory"
    url: "https://greenbankobservatory.org/"
    note: >
      Home of our CHIME/FRB outrigger and the telescopes behind DSPIRA —
      minutes from campus, inside the National Radio Quiet Zone.
  - name: "NRC Herzberg — Dominion Radio Astrophysical Observatory"
    url: "https://nrc.canada.ca/en/research-development/nrc-facilities/dominion-radio-astrophysical-observatory-research-facility"
    note: >
      CHIME's home site in Penticton, BC, where our hardware has run
      since the pathfinder.
  - name: "National Radio Astronomy Observatory"
    url: "https://public.nrao.edu/"
    note: >
      Pulsar and FRB collaborators from the Central Development Laboratory
      to open-source software.
  - name: "McGill University"
    url: "https://www.mcgill.ca/"
    note: >
      CHIME/FRB instrument and correlator partner — and where the ICE
      system was born.
  - name: "University of British Columbia"
    url: "https://www.ubc.ca/"
    note: "CHIME analysis and operations partner from the pathfinder onward."
  - name: "University of Toronto"
    url: "https://www.utoronto.ca/"
    note: "Dunlap Institute instrumentation and the Algonquin 10-m VLBI pathfinder."
  - name: "Massachusetts Institute of Technology"
    url: "https://web.mit.edu/"
    note: "VLBI correlation and outrigger science with the MIT Kavli Institute."
  - name: "Yale University"
    url: "https://www.yale.edu/"
    note: "HIRAX analog systems, drone beam mapping, and digital calibration."
  - name: "Carnegie Mellon University"
    url: "https://www.cmu.edu/"
    note: "21 cm cosmology collaborators since the GBT intensity-mapping days."
  - name: "University of KwaZulu-Natal"
    url: "https://ukzn.ac.za/"
    note: "Lead institution of HIRAX in South Africa's Karoo."

