# Site settings for WVU RAIL (https://wvurail.org)
# Values here are available in templates as {{ site.title }}, {{ site.email }}, etc.
# NOTE: Jekyll does NOT reload this file on `serve` — restart the server after editing.

title: WVU RAIL
tagline: Radio Astronomy Instrumentation Laboratory
email: wvurail@gmail.com
description: >
  RAIL is a multidisciplinary group within the Lane Department of Computer Science
  and Electrical Engineering at West Virginia University, focused on engineering and
  science solutions in radio astronomy.

baseurl: ""                     # subpath of the site, e.g. /blog (empty for a root domain)
url: "https://wvurail.org"      # base hostname & protocol, no trailing slash

# Content & build
markdown: kramdown
include: ['_pages']

plugins:                        # `plugins:` is the modern key (old `gems:` is deprecated)
  - jekyll-feed
  - jekyll-sitemap

exclude:
  # Windows writes an NTFS "downloaded from the internet" stream beside any
  # downloaded file; through WSL it lands as "logo.svg:Zone.Identifier". A
  # colon is illegal in a GitHub Actions artifact path, so one of these
  # reaching _site turns the build red at the upload step.
  - "*:Zone.Identifier"
  - Gemfile
  - Gemfile.lock
  - Gemfile.ci          # written by CI only
  - Gemfile.ci.lock
  - README.md
  - vendor
  # Internal working notes. Markdown without front matter is copied verbatim to
  # the site root, so anything here would otherwise be public at /<name>.md.
  # The file is ALSO named with a leading underscore, which Jekyll ignores
  # structurally — belt and braces, since this one names a retracted paper.
  - _PUBLICATIONS-REVIEW.md
